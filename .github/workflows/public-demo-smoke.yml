name: Public Demo Smoke

on:
  workflow_dispatch:
    inputs:
      demo_url:
        description: Public Render URL, for example https://your-service.onrender.com
        required: false
        type: string
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

jobs:
  smoke:
    name: Cold-start, demo, and read-only smoke
    runs-on: ubuntu-latest
    env:
      PUBLIC_DEMO_URL: ${{ github.event.inputs.demo_url || vars.PUBLIC_DEMO_URL }}

    steps:
      - name: Require a public Demo URL
        shell: bash
        run: |
          if [ -z "${PUBLIC_DEMO_URL}" ]; then
            echo "::error title=Public Demo URL is not configured::Set repository variable PUBLIC_DEMO_URL or provide the workflow_dispatch input."
            exit 1
          fi

      - name: Validate URL and smoke public Demo
        shell: bash
        run: |
          set -euo pipefail

          base_url="${PUBLIC_DEMO_URL%/}"
          origin="$(python - "${base_url}" <<'PY'
          from urllib.parse import urlsplit
          import sys

          value = sys.argv[1]
          parsed = urlsplit(value)
          if parsed.scheme not in {"https", "http"} or not parsed.netloc:
              raise SystemExit("PUBLIC_DEMO_URL must be an absolute http(s) origin.")
          if parsed.path not in {"", "/"} or parsed.query or parsed.fragment:
              raise SystemExit("PUBLIC_DEMO_URL must not include a path, query, or fragment.")
          print(f"{parsed.scheme}://{parsed.netloc}")
          PY
          )"

          health_file="$(mktemp)"
          demo_file="$(mktemp)"
          me_file="$(mktemp)"
          goals_file="$(mktemp)"
          cookie_jar="$(mktemp)"
          trap 'rm -f "${health_file}" "${demo_file}" "${me_file}" "${goals_file}" "${cookie_jar}"' EXIT

          curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 15 \
            --connect-timeout 15 --max-time 90 \
            "${base_url}/api/health" > "${health_file}"
          python - "${health_file}" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("code") != 0 or payload.get("data", {}).get("status") != "ok":
              raise SystemExit(f"health response is not successful: {payload}")
          PY

          curl --fail-with-body --retry 2 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 45 \
            -X POST "${base_url}/api/auth/demo" \
            -H "Origin: ${origin}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --cookie-jar "${cookie_jar}" > "${demo_file}"
          python - "${demo_file}" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("code") != 0 or payload.get("data", {}).get("accountType") != "demo":
              raise SystemExit(f"demo response is not successful: {payload}")
          PY

          curl --fail-with-body --connect-timeout 15 --max-time 45 \
            --cookie "${cookie_jar}" "${base_url}/api/auth/me" > "${me_file}"
          curl --fail-with-body --connect-timeout 15 --max-time 45 \
            --cookie "${cookie_jar}" "${base_url}/api/goals" > "${goals_file}"
          python - "${me_file}" "${goals_file}" <<'PY'
          import json
          import sys

          me = json.load(open(sys.argv[1], encoding="utf-8"))
          goals = json.load(open(sys.argv[2], encoding="utf-8"))
          if me.get("code") != 0 or me.get("data", {}).get("accountType") != "demo":
              raise SystemExit(f"/auth/me response is not a demo session: {me}")
          if goals.get("code") != 0 or not isinstance(goals.get("data"), list):
              raise SystemExit(f"read-only goals response is not successful: {goals}")
          PY
