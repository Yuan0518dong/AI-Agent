name: Backend Tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

jobs:
  test:
    name: Reliability checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run Ruff
        run: python -m ruff check backend

      - name: Run backend tests
        env:
          PYTHONPATH: .
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
          LLM_ENV_FILE: .missing-ci.env
        run: python -m pytest backend/tests -q --tb=short

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Run mock smoke test
        env:
          PYTHONPATH: .
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
          LLM_ENV_FILE: .missing-ci.env
        run: python backend/smoke_api.py

      - name: Check frontend syntax and diff whitespace
        run: |
          npm ci
          npm run check
          python backend/check_sensitive_content.py
          git diff --check HEAD^ HEAD

  postgres:
    name: PostgreSQL pgvector integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: .
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_agent_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_agent_test
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_agent_test
      CORS_ORIGINS: http://127.0.0.1:8001,http://localhost:8001
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      LLM_ENV_FILE: .missing-ci.env

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Apply PostgreSQL migrations
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Run PostgreSQL integration tests
        run: python -m pytest backend/tests -m postgres -q --tb=short

  playwright:
    name: Playwright portfolio E2E
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      LLM_ENV_FILE: .missing-ci.env
      EMBEDDING_ENV_FILE: .missing-ci.env

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Batch 4 browser acceptance
        run: npm run test:e2e
