name: Backend Tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

jobs:
  test:
    name: Reliability checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
          LLM_PROVIDER: mock
          LLM_ENV_FILE: .missing-ci.env
        run: python -m pytest backend/tests -q --tb=short

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Run mock smoke test
        env:
          PYTHONPATH: .
          LLM_PROVIDER: mock
          LLM_ENV_FILE: .missing-ci.env
        run: python backend/smoke_api.py

      - name: Check frontend syntax and diff whitespace
        run: |
          node --check app/api.js
          node --check app/app.js
          node --check app/modules/agent-workbench.js
          git diff --check
