<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通用成长学习助手 App 原型</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css?v=workspace-ui-20260703" />
  </head>
  <body>
    <section class="auth-shell" id="auth-shell">
      <div class="auth-card">
        <div class="auth-copy">
          <div class="auth-brand">
            <div class="brand-mark" aria-hidden="true">
              <span></span>
              <span></span>
            </div>
            <div>
              <p class="eyebrow">Growth Agent</p>
              <h1>成长学习助手</h1>
            </div>
          </div>
          <p>把目标、资料、计划和 AI 问答放在一个学习工作台里，登录后继续你的成长路径。</p>
          <div class="auth-highlights" aria-label="核心能力">
            <span>目标管理</span>
            <span>资料问答</span>
            <span>进度追踪</span>
          </div>
        </div>

        <div class="auth-panel">
          <div class="auth-panel-head">
            <h2>账号入口</h2>
            <p>使用邮箱注册或登录</p>
          </div>
          <div class="auth-tabs" role="tablist" aria-label="登录注册切换">
            <button class="active" id="show-login" type="button">登录</button>
            <button id="show-register" type="button">注册</button>
          </div>

          <form class="auth-form active" id="login-form">
            <label>
              邮箱
              <input name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
            </label>
            <label>
              密码
              <input name="password" type="password" required autocomplete="current-password" placeholder="至少 6 位" />
            </label>
            <button class="primary-button" id="login-submit" type="submit">登录</button>
          </form>

          <form class="auth-form" id="register-form">
            <label>
              昵称
              <input name="name" required autocomplete="name" placeholder="例如：陈" />
            </label>
            <label>
              邮箱
              <input name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
            </label>
            <label>
              密码
              <input name="password" type="password" required autocomplete="new-password" placeholder="至少 6 位" />
            </label>
            <label>
              确认密码
              <input name="confirmPassword" type="password" required autocomplete="new-password" placeholder="再次输入密码" />
            </label>
            <button class="primary-button" id="register-submit" type="submit">创建账号</button>
          </form>
        </div>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="app-shell" id="app-shell" hidden>
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">
              <span></span>
              <span></span>
            </div>
            <div class="brand-text">
              <strong>成长学习助手</strong>
              <small>成长智能体</small>
            </div>
          </div>
          <button class="sidebar-toggle" id="sidebar-toggle" type="button" title="折叠侧边栏">‹</button>
        </div>

        <nav class="nav" aria-label="主导航">
          <button class="nav-item active" data-view="today"><span>⌂</span>今日</button>
          <button class="nav-item" data-view="goals"><span>＋</span>目标</button>
          <button class="nav-item" data-view="materials"><span>▣</span>资料</button>
          <button class="nav-item" data-view="study"><span>?</span>学习</button>
          <button class="nav-item" data-view="memory"><span>◇</span>记忆</button>
          <button class="nav-item" data-view="progress"><span>▥</span>进度</button>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">MVP Prototype</p>
            <h1 id="page-title">今日行动</h1>
          </div>
          <div class="top-actions">
            <span class="user-chip" id="current-user"></span>
            <button class="ghost-button" id="logout-button" title="退出登录">退出</button>
            <button class="ghost-button" id="export-data" title="导出本地数据">⇩</button>
            <button class="danger-button" id="reset-data" title="清空本地数据">×</button>
          </div>
        </header>

        <section class="view active" id="view-today">
          <div class="summary-grid">
            <article class="metric">
              <span>目标数</span>
              <strong id="metric-goals">0</strong>
            </article>
            <article class="metric">
              <span>今日任务</span>
              <strong id="metric-tasks">0</strong>
            </article>
            <article class="metric">
              <span>完成率</span>
              <strong id="metric-rate">0%</strong>
            </article>
            <article class="metric">
              <span>闪卡</span>
              <strong id="metric-cards">0</strong>
            </article>
          </div>

          <div class="workspace two-columns">
            <section class="panel task-panel">
              <div class="panel-head">
                <h2>今日任务</h2>
                <div class="inline-actions">
                  <input class="compact-input" type="date" id="today-date-filter" />
                  <button class="ghost-button" id="reset-today-date" type="button">今天</button>
                  <select class="compact-input" id="quick-plan-days" title="计划天数">
                    <option value="3">3 天</option>
                    <option value="7" selected>7 天</option>
                    <option value="14">14 天</option>
                  </select>
                  <button class="primary-button" id="quick-plan">生成计划</button>
                </div>
              </div>
              <div class="list" id="today-task-list"></div>
            </section>

            <section class="panel accent-panel">
              <h2>学习状态</h2>
              <div class="focus-card">
                <div class="focus-visual" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
                <div>
                  <h3 id="focus-title">先创建一个成长目标</h3>
                  <p id="focus-text">设置目标后，系统会根据资料和截止时间生成学习计划。</p>
                </div>
              </div>
            </section>
          </div>
        </section>

        <section class="view" id="view-goals">
          <div class="workspace two-columns">
            <section class="panel">
              <h2 id="goal-form-title">新建成长目标</h2>
              <form id="goal-form" class="form">
                <label>
                  目标名称
                  <input name="name" required placeholder="例如：准备英语四级" />
                </label>
                <label>
                  学习科目
                  <input name="subject" required placeholder="例如：英语" />
                </label>
                <label>
                  当前水平
                  <select name="level">
                    <option>刚开始</option>
                    <option>有基础</option>
                    <option>冲刺复习</option>
                  </select>
                </label>
                <label>
                  目标日期
                  <input type="date" name="deadline" required />
                </label>
                <label>
                  每天学习时间
                  <select name="dailyMinutes">
                    <option value="30">30 分钟</option>
                    <option value="60" selected>60 分钟</option>
                    <option value="90">90 分钟</option>
                    <option value="120">120 分钟</option>
                  </select>
                </label>
                <label>
                  重点难点
                  <textarea name="notes" rows="4" placeholder="写下你最担心或最想突破的内容"></textarea>
                </label>
                <div class="form-actions">
                  <button class="primary-button" id="goal-submit-button" type="submit">＋ 创建目标</button>
                  <button class="ghost-button" id="cancel-goal-edit" type="button" hidden>取消编辑</button>
                </div>
              </form>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>目标列表</h2>
                <div class="inline-actions">
                  <select class="compact-input" id="goal-plan-days" title="计划天数">
                    <option value="3">3 天</option>
                    <option value="7" selected>7 天</option>
                    <option value="14">14 天</option>
                  </select>
                  <button class="ghost-button" id="generate-all-plans" title="为所有目标生成计划">▦</button>
                </div>
              </div>
              <div class="list" id="goal-list"></div>
            </section>
          </div>

          <section class="panel detail-panel" id="goal-detail-panel">
            <div class="panel-head">
              <h2>目标详情</h2>
              <button class="ghost-button" id="clear-goal-detail" title="关闭目标详情">×</button>
            </div>
            <div id="goal-detail"></div>
          </section>
        </section>

        <section class="view" id="view-materials">
          <div class="workspace two-columns">
            <section class="panel">
              <h2 id="material-form-title">添加成长资料</h2>
              <form id="material-form" class="form">
                <label>
                  资料标题
                  <input name="title" required placeholder="例如：第一章 细胞结构" />
                </label>
                <label>
                  资料类型
                  <select name="type">
                    <option value="text">文本</option>
                    <option value="link">网页链接</option>
                    <option value="text">PDF 摘录</option>
                  </select>
                </label>
                <label>
                  内容
                  <textarea name="content" rows="8" required placeholder="粘贴资料正文或网页链接"></textarea>
                </label>
                <button class="primary-button" id="material-submit-button" type="submit">▣ 保存并整理</button>
                <button class="ghost-button" id="cancel-material-edit" type="button" hidden>取消编辑</button>
              </form>
            </section>

            <section class="panel">
              <h2>资料库</h2>
              <div class="list" id="material-list"></div>
            </section>
          </div>
        </section>

        <section class="view" id="view-study">
          <div class="workspace two-columns study-layout">
            <section class="panel">
              <h2>成长问答</h2>
              <div class="chat" id="chat-log"></div>
              <form id="chat-form" class="chat-form">
                <input name="question" required placeholder="问一个知识点，例如：帮我解释重点内容" />
                <button class="primary-button" type="submit">发送</button>
              </form>
            </section>

            <section class="panel summary-panel">
              <div class="panel-head">
                <h2>资料总结</h2>
                <form id="chunk-search-form" class="inline-actions">
                  <input class="compact-input" name="query" placeholder="搜索学习片段" />
                  <button class="ghost-button" id="chunk-search-button" type="submit">搜索</button>
                </form>
              </div>
              <div class="chunk-search-results" id="chunk-search-results"></div>
              <div class="list summary-list" id="summary-list"></div>
            </section>
          </div>
        </section>

        <section class="view" id="view-memory">
          <div class="workspace two-columns">
            <section class="panel">
              <div class="panel-head">
                <h2>闪卡复习</h2>
                <button class="ghost-button" id="shuffle-cards" title="切换一张闪卡">↻</button>
              </div>
              <div class="flashcard" id="flashcard">
                <span>暂无闪卡</span>
                <strong>添加资料后会自动生成记忆卡片</strong>
              </div>
              <div class="segmented">
                <button id="card-known">已掌握</button>
                <button id="card-review">还要复习</button>
              </div>
            </section>

            <section class="panel memory-review-panel">
              <div class="panel-head">
                <h2>复盘草稿</h2>
                <span class="panel-count" id="review-draft-count">0 条</span>
              </div>
              <div class="review-draft-list" id="review-draft-list"></div>
              <h2 class="section-subtitle">测试题</h2>
              <div class="list" id="quiz-list"></div>
            </section>
          </div>
        </section>

        <section class="view" id="view-progress">
          <div class="workspace">
            <section class="panel">
              <h2>成长进度</h2>
              <div class="progress-list" id="progress-list"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <template id="empty-template">
      <div class="empty">
        <strong></strong>
        <p></p>
      </div>
    </template>

    <script src="./api.js?v=user-cache-20260703"></script>
    <script src="./modules/utils.js?v=user-cache-20260703"></script>
    <script src="./modules/chat.js?v=user-cache-20260703"></script>
    <script src="./modules/materials.js?v=user-cache-20260703"></script>
    <script src="./modules/goals.js?v=user-cache-20260703"></script>
    <script src="./modules/progress.js?v=user-cache-20260703"></script>
    <script src="./app.js?v=user-cache-20260703"></script>
  </body>
</html>
