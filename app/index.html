<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通用成长学习助手 App 原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
          </div>
          <div>
            <strong>成长学习助手</strong>
            <small>成长智能体</small>
          </div>
        </div>

        <nav class="nav" aria-label="主导航">
          <button class="nav-item active" data-view="today"><span>⌂</span>今日</button>
          <button class="nav-item" data-view="goals"><span>＋</span>目标</button>
          <button class="nav-item" data-view="materials"><span>▣</span>资料</button>
          <button class="nav-item" data-view="study"><span>?</span>学习</button>
          <button class="nav-item" data-view="memory"><span>◇</span>记忆</button>
          <button class="nav-item" data-view="progress"><span>▥</span>进度</button>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">MVP Prototype</p>
            <h1 id="page-title">今日行动</h1>
          </div>
          <div class="top-actions">
            <button class="ghost-button" id="export-data" title="导出本地数据">⇩</button>
            <button class="danger-button" id="reset-data" title="清空本地数据">×</button>
          </div>
        </header>

        <section class="view active" id="view-today">
          <div class="summary-grid">
            <article class="metric">
              <span>目标数</span>
              <strong id="metric-goals">0</strong>
            </article>
            <article class="metric">
              <span>今日任务</span>
              <strong id="metric-tasks">0</strong>
            </article>
            <article class="metric">
              <span>完成率</span>
              <strong id="metric-rate">0%</strong>
            </article>
            <article class="metric">
              <span>闪卡</span>
              <strong id="metric-cards">0</strong>
            </article>
          </div>

          <div class="workspace two-columns">
            <section class="panel">
              <div class="panel-head">
                <h2>今日任务</h2>
                <button class="primary-button" id="quick-plan">生成计划</button>
              </div>
              <div class="list" id="today-task-list"></div>
            </section>

            <section class="panel accent-panel">
              <h2>学习状态</h2>
              <div class="focus-card">
                <div class="focus-visual" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
                <div>
                  <h3 id="focus-title">先创建一个成长目标</h3>
                  <p id="focus-text">设置目标后，系统会根据资料和截止时间生成学习计划。</p>
                </div>
              </div>
            </section>
          </div>
        </section>

        <section class="view" id="view-goals">
          <div class="workspace two-columns">
            <section class="panel">
              <h2 id="goal-form-title">新建成长目标</h2>
              <form id="goal-form" class="form">
                <label>
                  目标名称
                  <input name="name" required placeholder="例如：准备英语四级" />
                </label>
                <label>
                  学习科目
                  <input name="subject" required placeholder="例如：英语" />
                </label>
                <label>
                  当前水平
                  <select name="level">
                    <option>刚开始</option>
                    <option>有基础</option>
                    <option>冲刺复习</option>
                  </select>
                </label>
                <label>
                  目标日期
                  <input type="date" name="deadline" required />
                </label>
                <label>
                  每天学习时间
                  <select name="dailyMinutes">
                    <option value="30">30 分钟</option>
                    <option value="60" selected>60 分钟</option>
                    <option value="90">90 分钟</option>
                    <option value="120">120 分钟</option>
                  </select>
                </label>
                <label>
                  重点难点
                  <textarea name="notes" rows="4" placeholder="写下你最担心或最想突破的内容"></textarea>
                </label>
                <div class="form-actions">
                  <button class="primary-button" id="goal-submit-button" type="submit">＋ 创建目标</button>
                  <button class="ghost-button" id="cancel-goal-edit" type="button" hidden>取消编辑</button>
                </div>
              </form>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>目标列表</h2>
                <button class="ghost-button" id="generate-all-plans" title="为所有目标生成计划">▦</button>
              </div>
              <div class="list" id="goal-list"></div>
            </section>
          </div>

          <section class="panel detail-panel" id="goal-detail-panel">
            <div class="panel-head">
              <h2>目标详情</h2>
              <button class="ghost-button" id="clear-goal-detail" title="关闭目标详情">×</button>
            </div>
            <div id="goal-detail"></div>
          </section>
        </section>

        <section class="view" id="view-materials">
          <div class="workspace two-columns">
            <section class="panel">
              <h2>添加成长资料</h2>
              <form id="material-form" class="form">
                <label>
                  资料标题
                  <input name="title" required placeholder="例如：第一章 细胞结构" />
                </label>
                <label>
                  资料类型
                  <select name="type">
                    <option>文本</option>
                    <option>网页链接</option>
                    <option>PDF 摘录</option>
                  </select>
                </label>
                <label>
                  内容
                  <textarea name="content" rows="8" required placeholder="粘贴资料正文或网页链接"></textarea>
                </label>
                <button class="primary-button" type="submit">▣ 保存并整理</button>
              </form>
            </section>

            <section class="panel">
              <h2>资料库</h2>
              <div class="list" id="material-list"></div>
            </section>
          </div>
        </section>

        <section class="view" id="view-study">
          <div class="workspace two-columns study-layout">
            <section class="panel">
              <h2>成长问答</h2>
              <div class="chat" id="chat-log"></div>
              <form id="chat-form" class="chat-form">
                <input name="question" required placeholder="问一个知识点，例如：帮我解释重点内容" />
                <button class="primary-button" type="submit">发送</button>
              </form>
            </section>

            <section class="panel">
              <h2>资料总结</h2>
              <div class="list" id="summary-list"></div>
            </section>
          </div>
        </section>

        <section class="view" id="view-memory">
          <div class="workspace two-columns">
            <section class="panel">
              <div class="panel-head">
                <h2>闪卡复习</h2>
                <button class="ghost-button" id="shuffle-cards" title="切换一张闪卡">↻</button>
              </div>
              <div class="flashcard" id="flashcard">
                <span>暂无闪卡</span>
                <strong>添加资料后会自动生成记忆卡片</strong>
              </div>
              <div class="segmented">
                <button id="card-known">已掌握</button>
                <button id="card-review">还要复习</button>
              </div>
            </section>

            <section class="panel">
              <h2>测试题</h2>
              <div class="list" id="quiz-list"></div>
            </section>
          </div>
        </section>

        <section class="view" id="view-progress">
          <div class="workspace">
            <section class="panel">
              <h2>成长进度</h2>
              <div class="progress-list" id="progress-list"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <template id="empty-template">
      <div class="empty">
        <strong></strong>
        <p></p>
      </div>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
