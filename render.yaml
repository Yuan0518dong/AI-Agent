services:
  - type: web
    name: ai-agent-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      # Neon pooled URL used by the application process.
      - key: DATABASE_URL
        sync: false
      # Neon direct URL used only by the Alembic command in Dockerfile.
      - key: MIGRATION_DATABASE_URL
        sync: false
      # Must be an explicit public-origin allowlist, never '*'.
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_HASH_SALT
        sync: false
      # Configure only after verifying the Render proxy source CIDRs.
      - key: TRUST_PROXY_HEADERS
        sync: false
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
